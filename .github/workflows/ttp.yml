name: TTP
on:
  pull_request:
    branches: [portal-ts, portal-rust, portal-phoenix]
  push:
    branches: [portal-ts, portal-rust, portal-phoenix]
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  ttp:
    # A public fork must never execute on the operational Mini. No PR-target checkout.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner)
    runs-on: [self-hosted, macOS, ARM64, frame-ttp]
    timeout-minutes: 90
    environment:
      name: ${{ github.event_name == 'push' && 'ttp-staging' || 'ttp-checks' }}
    env:
      HUSKY: '0'
      TTP_STATE_DIR: ${{ runner.temp }}/ttp-${{ github.run_id }}-${{ github.run_attempt }}
      TTP_FAKE_SHA: ${{ vars.TTP_FAKE_SHA }}
      GH_TOKEN: ${{ github.token }}
      INFISICAL_URL: ${{ vars.INFISICAL_URL }}
      INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
      INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
      INFISICAL_ENVIRONMENT: ${{ vars.INFISICAL_ENVIRONMENT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - name: setup
        id: setup
        shell: bash
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          /opt/homebrew/bin/python3 infra/ttp/pipeline.py init
      - name: cache
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.setup.outputs.cache_paths }}
          key: ttp-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.variant }}-${{ steps.setup.outputs.toolchain_key }}-${{ hashFiles('pnpm-lock.yaml', 'Cargo.lock', 'mix.lock') }}
      - name: install
        id: install
        run: python3 infra/ttp/pipeline.py run install
      - name: lint-format
        id: lint-format
        run: python3 infra/ttp/pipeline.py run lint-format
      - name: typecheck-compile
        id: typecheck-compile
        run: python3 infra/ttp/pipeline.py run typecheck-compile
      - name: tests
        id: tests
        run: python3 infra/ttp/pipeline.py run tests
      - name: image-build
        id: image-build
        if: github.event_name == 'push'
        run: python3 infra/ttp/pipeline.py run image-build
      - name: staging-deploy
        id: staging-deploy
        if: github.event_name == 'push'
        run: python3 infra/ttp/pipeline.py run staging-deploy
      - name: staging-smoke
        id: staging-smoke
        if: github.event_name == 'push'
        run: python3 infra/ttp/pipeline.py run staging-smoke
      - name: timing-report
        if: always()
        env:
          TTP_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          TTP_JOB_STATUS: ${{ job.status }}
        run: python3 infra/ttp/pipeline.py report
      - name: timing-artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ttp-${{ steps.setup.outputs.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TTP_STATE_DIR }}/ttp-timings.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
